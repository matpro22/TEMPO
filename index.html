<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tempo · BTS CIEL</title>
  <meta name="theme-color" content="#eef2f8">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235AC8FA'/%3E%3Cstop offset='1' stop-color='%235E5CE6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ccircle cx='32' cy='34' r='17' fill='none' stroke='white' stroke-width='5'/%3E%3Cpath d='M32 24v10l7 5' stroke='white' stroke-width='5' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Tempo">
  <meta name="format-detection" content="telephone=no">
  <!-- Écran de chargement : style inline pour s'afficher avant tout le reste -->
  <script>
    try { var raw = localStorage.getItem('tempo.ciel.v1') || ''; if (raw.indexOf('"theme":"dark"') > -1 || (raw.indexOf('"theme":"auto"') > -1 && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
  </script>
  <style>
    #splash { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; overflow: hidden; background: #eef2f8; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: #1d1d1f; transition: opacity .6s cubic-bezier(.22,1,.36,1), transform .7s cubic-bezier(.22,1,.36,1), filter .6s; }
    html[data-theme="dark"] #splash { background: #0b0d13; color: #f5f5f7; }
    #splash.out { opacity: 0; transform: scale(1.06); filter: blur(12px); pointer-events: none; }
    #splash .sp-blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .7; animation: spFloat 6s ease-in-out infinite alternate; }
    html[data-theme="dark"] #splash .sp-blob { opacity: .35; }
    #splash .sp-b1 { width: 60vmax; height: 60vmax; left: -20vmax; top: -25vmax; background: #9ad7ff; }
    #splash .sp-b2 { width: 50vmax; height: 50vmax; right: -18vmax; top: -10vmax; background: #d4c2ff; animation-delay: -2s; }
    #splash .sp-b3 { width: 55vmax; height: 55vmax; left: 10vmax; bottom: -30vmax; background: #ffc6e2; animation-delay: -4s; }
    @keyframes spFloat { to { transform: translate(4vmax, 3vmax) scale(1.08); } }
    #splash .sp-card { position: relative; display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 38px 46px 30px; border-radius: 34px; background: linear-gradient(150deg, rgba(255,255,255,.75), rgba(255,255,255,.4)); -webkit-backdrop-filter: blur(24px) saturate(190%); backdrop-filter: blur(24px) saturate(190%); box-shadow: inset 0 1px 0 rgba(255,255,255,.95), inset 0 0 0 1px rgba(255,255,255,.5), 0 30px 80px -20px rgba(30,45,90,.35); animation: spIn .8s cubic-bezier(.34,1.56,.64,1) both; }
    html[data-theme="dark"] #splash .sp-card { background: linear-gradient(150deg, rgba(50,54,68,.7), rgba(30,32,42,.55)); box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 30px 80px -20px rgba(0,0,0,.7); }
    @keyframes spIn { from { opacity: 0; transform: translateY(24px) scale(.9); } }
    #splash .sp-logo { position: relative; width: 92px; height: 92px; border-radius: 26px; display: grid; place-items: center; background: linear-gradient(135deg, #5AC8FA, #0A84FF 55%, #5E5CE6); box-shadow: 0 14px 34px -8px rgba(10,132,255,.7), inset 0 2px 0 rgba(255,255,255,.5); animation: spPulse 2s ease-in-out infinite; }
    #splash .sp-logo::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.55) 48%, transparent 62%); background-size: 250% 100%; animation: spShine 2.2s ease-in-out infinite; }
    @keyframes spPulse { 50% { transform: scale(1.05); } }
    @keyframes spShine { from { background-position: 150% 0; } to { background-position: -100% 0; } }
    #splash .sp-logo svg { width: 58px; height: 58px; overflow: visible; }
    #splash .sp-hand { transform-origin: 32px 35px; animation: spTurn 1.4s linear infinite; }
    #splash .sp-hand2 { transform-origin: 32px 35px; animation: spTurn 8s linear infinite; }
    @keyframes spTurn { to { transform: rotate(360deg); } }
    #splash h1 { margin: 0; font-size: 2rem; font-weight: 800; letter-spacing: -.045em; background: linear-gradient(120deg, #1d1d1f 35%, #0A84FF); -webkit-background-clip: text; background-clip: text; color: transparent; }
    html[data-theme="dark"] #splash h1 { background-image: linear-gradient(120deg, #f5f5f7 35%, #64D2FF); }
    #splash .sp-bar { width: 190px; height: 6px; border-radius: 3px; background: rgba(120,120,135,.18); overflow: hidden; }
    #splash .sp-bar i { display: block; height: 100%; width: 40%; border-radius: inherit; background: linear-gradient(90deg, #5AC8FA, #0A84FF, #BF5AF2); animation: spBar 1.3s cubic-bezier(.65,0,.35,1) infinite; }
    @keyframes spBar { from { transform: translateX(-110%); } to { transform: translateX(260%); } }
    #splash .sp-txt { margin: 0; min-height: 1.2em; font-size: .9rem; color: #86868b; text-align: center; max-width: 260px; animation: spFade .5s ease both .3s; }
    @keyframes spFade { from { opacity: 0; transform: translateY(6px); } }
    @media (prefers-reduced-motion: reduce) { #splash * { animation-duration: 0s !important; } }
  </style>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="splash" role="status" aria-label="Chargement de Tempo">
    <div class="sp-blob sp-b1"></div><div class="sp-blob sp-b2"></div><div class="sp-blob sp-b3"></div>
    <div class="sp-card">
      <div class="sp-logo">
        <svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-linecap="round">
          <circle cx="32" cy="35" r="20" stroke-width="5"/>
          <path d="M26 9h12" stroke-width="5"/>
          <path class="sp-hand2" d="M32 35v-9" stroke-width="5"/>
          <path class="sp-hand" d="M32 35l9 5" stroke-width="4.5"/>
          <circle cx="32" cy="35" r="3" fill="#fff" stroke="none"/>
        </svg>
      </div>
      <h1>Tempo</h1>
      <div class="sp-bar"><i></i></div>
      <p class="sp-txt" id="sp-txt"></p>
    </div>
  </div>
  <script>
    (function () {
      var t = ['Chargement de ta motivation… ☕', 'On réveille les VLAN… 📶', 'Ping du cerveau en cours… 🧠', 'On range ton Gantt… 📊', 'Compilation du courage… 💪', 'Synchronisation des neurones… ⚡', 'On cherche le bouton « productivité »… 🔍', 'Dépoussiérage du Kanban… 🧹'];
      var el = document.getElementById('sp-txt'); if (el) el.textContent = t[Math.floor(Math.random() * t.length)];
      window.__hideSplash = function () {
        var s = document.getElementById('splash'); if (!s || s.classList.contains('out')) return;
        s.classList.add('out'); setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 750);
      };
      setTimeout(window.__hideSplash, 8000); // sécurité
    })();
  </script>
  <!-- Fond animé -->
  <div class="bg" aria-hidden="true">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div><div class="blob b5"></div>
    <div class="bg-image"></div>
    <div class="grain"></div>
  </div>

  <!-- Filtres SVG pour l'effet de réfraction liquid glass -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="lg-refract" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="2" seed="11" result="noise"/>
      <feGaussianBlur in="noise" stdDeviation="2.5" result="soft"/>
      <feDisplacementMap in="SourceGraphic" in2="soft" scale="38" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>

  <div class="app" id="app">
    <aside class="sidebar glass" id="sidebar">
      <div class="brand">
        <div class="brand-logo">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="7.5"/><path d="M12 9v4.2l2.8 2"/><path d="M9.5 2.8h5"/></svg>
        </div>
        <div class="brand-txt"><b>Tempo</b><small id="brand-sub">BTS CIEL</small></div>
        <button class="icon-btn collapse-btn" id="collapse-btn" title="Réduire la barre latérale"></button>
      </div>
      <nav class="nav" id="nav"><div class="nav-indicator lg-refract" id="nav-indicator"></div></nav>
      <div class="sidebar-foot">
        <button class="mini-timer" id="mini-timer" hidden></button>
        <div class="save-state" id="save-state"><span class="dot"></span><span class="txt">Enregistré</span></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar glass" id="topbar">
        <div class="tb-title">
          <h1 id="view-title">Accueil</h1>
          <p id="view-sub"></p>
        </div>
        <div class="tb-actions">
          <button class="search-btn" id="search-btn" title="Rechercher (Ctrl+K)">
            <span class="ico" data-icon="search"></span><span class="lbl">Rechercher…</span><kbd>Ctrl K</kbd>
          </button>
          <button class="icon-btn" id="undo-btn" title="Annuler (Ctrl+Z)" data-icon="undo"></button>
          <button class="icon-btn" id="redo-btn" title="Rétablir (Ctrl+Y)" data-icon="redo"></button>
          <button class="icon-btn" id="theme-btn" title="Thème clair / sombre" data-icon="moon"></button>
          <button class="btn primary add-btn" id="add-btn" title="Ajouter"><span data-icon="plus"></span><span class="lbl">Ajouter</span></button>
        </div>
      </header>
      <section class="view" id="view" tabindex="-1"></section>
    </main>
  </div>

  <nav class="dock glass" id="dock"></nav>
  <div id="overlay-root"></div>
  <div class="toasts" id="toasts"></div>

  <script src="js/core.js"></script>
  <script src="js/perso.js" onerror="void 0"></script>
  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/fun.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/reminders.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/journal.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/timetable.js"></script>
  <script src="js/views/projects.js"></script>
  <script src="js/views/gantt.js"></script>
  <script src="js/views/tasks.js"></script>
  <script src="js/views/homework.js"></script>
  <script src="js/views/calendar.js"></script>
  <script src="js/views/focus.js"></script>
  <script src="js/views/stats.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
